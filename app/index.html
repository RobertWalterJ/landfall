<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Landfall</title>
<meta name="description" content="A geography game: islands, countries, provinces and capitals, drilled until you own them.">
<meta name="theme-color" content="#0b2e30">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="styles.css">
</head>
<body data-screen="boot">

<div class="boot" id="boot">
  <div class="boot-mark"><span>Land</span><span>fall</span></div>
  <div class="boot-sub">unfolding the map…</div>
</div>

<main id="app" class="app"></main>

<!-- The verdict sheet lives OUTSIDE the screen container on purpose: position:
     fixed anchors to a transformed ancestor, and the screens animate a
     transform, which parks a fixed sheet below the bottom of the phone. -->
<div id="sheet" class="sheet" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
